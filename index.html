<style>
:root{
  --bg:#070b15; --panel:#0c1322; --panel2:#111a2e; --line:rgba(56,189,248,.14);
  --cyan:#38e1ff; --green:#2fe6a7; --red:#ff4d6d; --amber:#ffb454;
  --txt:#dfe9f5; --mut:#9aafca; --dim:#7185a3;
  --num:'Rajdhani',ui-sans-serif; --jp:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  --nav-h:58px; --hud-h:52px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{background:var(--bg);color:var(--txt);font-family:var(--jp);overflow-x:hidden;
  background-image:
    radial-gradient(ellipse 120% 60% at 50% -10%, rgba(56,189,248,.07), transparent 60%),
    linear-gradient(rgba(56,189,248,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(56,189,248,.03) 1px, transparent 1px);
  background-size:100% 100%, 44px 44px, 44px 44px;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:98;
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px);}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== BOOT ===== */
#boot{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;transition:opacity .4s}
#boot.off{opacity:0;pointer-events:none}
.bootlogo{font-family:var(--num);font-size:1.5rem;font-weight:700;letter-spacing:.35em;color:var(--cyan);text-shadow:0 0 18px rgba(56,225,255,.6)}
.bootline{font-family:var(--num);font-size:.72rem;letter-spacing:.2em;color:var(--dim);opacity:0;animation:bfade .3s forwards}
.bootline b{color:var(--green);font-weight:600}
.bootbar{width:180px;height:2px;background:var(--panel2);overflow:hidden;border-radius:2px}
.bootbar i{display:block;height:100%;width:0;background:var(--cyan);box-shadow:0 0 10px var(--cyan);animation:bload 1s .2s forwards}
@keyframes bfade{to{opacity:1}} @keyframes bload{to{width:100%}}

/* ===== HUD ===== */
#hud{position:fixed;top:0;left:0;right:0;height:calc(var(--hud-h) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);z-index:90;
  background:rgba(7,11,21,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding-left:14px;padding-right:10px}
.hud-title{font-family:var(--num);font-weight:700;font-size:1.02rem;letter-spacing:.14em;color:var(--cyan);white-space:nowrap}
.hud-title small{display:block;font-size:.5rem;letter-spacing:.32em;color:var(--dim);font-weight:600}
.hud-sp{flex:1}
.hud-chip{font-family:var(--num);font-size:.7rem;font-weight:600;letter-spacing:.06em;color:var(--mut);text-align:right;line-height:1.25}
.hud-chip b{color:var(--txt);font-size:.82rem}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.warn{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink 1.6s infinite}
.dot.crit{background:var(--red);box-shadow:0 0 8px var(--red);animation:blink .9s infinite}
@keyframes blink{50%{opacity:.25}}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--cyan);border-radius:10px;width:44px;height:44px;font-size:1.05rem;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.icon-btn:active{transform:scale(.92)}
.icon-btn:disabled{opacity:.75;cursor:wait}
.icon-btn.syncing{border-color:var(--green);color:var(--green);box-shadow:0 0 16px rgba(47,230,167,.25)}
.icon-btn.syncing span{display:block;animation:syncspin .9s linear infinite}
@keyframes syncspin{to{transform:rotate(360deg)}}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cyan)!important;outline-offset:2px}

/* ===== TICKER ===== */
#tickerwrap{position:fixed;top:calc(var(--hud-h) + env(safe-area-inset-top));left:0;right:0;z-index:89;height:26px;overflow:hidden;
  background:rgba(255,77,109,.06);border-bottom:1px solid rgba(255,77,109,.18)}
#ticker{display:inline-flex;white-space:nowrap;align-items:center;height:26px;animation:marq 30s linear infinite;will-change:transform}
#ticker span{font-family:var(--num);font-size:.72rem;font-weight:600;letter-spacing:.08em;color:var(--amber);padding:0 26px;position:relative}
#ticker span::before{content:'▶';color:var(--red);position:absolute;left:6px;font-size:.6rem}
@keyframes marq{to{transform:translateX(-50%)}}

/* ===== MAIN ===== */
main{padding:calc(var(--hud-h) + env(safe-area-inset-top) + 34px) 12px calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);max-width:640px;margin:0 auto}
.tab{display:none;animation:tabin .3s ease}
.tab.on{display:block}
@keyframes tabin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden}
.panel::before{content:'';position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,rgba(56,225,255,.35),transparent)}
.ptitle{font-family:var(--num);font-size:.68rem;font-weight:700;letter-spacing:.28em;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ptitle::before{content:'';width:5px;height:5px;background:var(--cyan);box-shadow:0 0 6px var(--cyan);transform:rotate(45deg)}
.ptitle .r{margin-left:auto;letter-spacing:.05em;color:var(--dim);font-size:.62rem}

/* ===== GATE (signature) ===== */
#gate{padding:18px 14px 16px;text-align:center}
#gate::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:
   linear-gradient(var(--cyan),var(--cyan)) top left/16px 1.5px,
   linear-gradient(var(--cyan),var(--cyan)) top left/1.5px 16px,
   linear-gradient(var(--cyan),var(--cyan)) top right/16px 1.5px,
   linear-gradient(var(--cyan),var(--cyan)) top right/1.5px 16px,
   linear-gradient(var(--cyan),var(--cyan)) bottom left/16px 1.5px,
   linear-gradient(var(--cyan),var(--cyan)) bottom left/1.5px 16px,
   linear-gradient(var(--cyan),var(--cyan)) bottom right/16px 1.5px,
   linear-gradient(var(--cyan),var(--cyan)) bottom right/1.5px 16px;
  background-repeat:no-repeat;opacity:.65}
.gate-ring{position:relative;width:196px;height:196px;margin:2px auto 8px}
.gate-ring svg{transform:rotate(-90deg)}
.gr-bg{fill:none;stroke:var(--panel2);stroke-width:7}
.gr-val{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1),stroke .5s}
.gate-sweep{position:absolute;inset:14px;border-radius:50%;overflow:hidden;pointer-events:none;
  -webkit-mask:radial-gradient(circle,transparent 54%,#000 55%);mask:radial-gradient(circle,transparent 54%,#000 55%)}
.gate-sweep::before{content:'';position:absolute;inset:-30%;background:conic-gradient(from 0deg, transparent 0 84%, rgba(56,225,255,.28) 96%, transparent 100%);animation:spin 4.5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.gate-core{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}
.gate-verdict{font-family:var(--num);font-size:2rem;font-weight:700;letter-spacing:.18em;line-height:1;text-shadow:0 0 20px currentColor}
.gate-health{font-family:var(--num);font-size:.72rem;font-weight:600;letter-spacing:.15em;color:var(--mut)}
.gate-health b{font-size:1rem;color:var(--txt)}
.gate-reason{font-size:.78rem;color:var(--mut);line-height:1.5;max-width:300px;margin:0 auto 12px}
.gate-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.gs{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.gs small{display:block;font-family:var(--num);font-size:.56rem;font-weight:700;letter-spacing:.2em;color:var(--dim);margin-bottom:3px}
.gs b{font-family:var(--num);font-size:.98rem;font-weight:700;letter-spacing:.02em}
.gs i{display:block;font-style:normal;font-family:var(--num);font-size:.62rem;color:var(--mut)}

/* ===== ISSUES ===== */
.issue{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);margin-bottom:7px;font-size:.8rem;line-height:1.5}
.issue:last-child{margin-bottom:0}
.issue .tag{flex-shrink:0;font-family:var(--num);font-size:.58rem;font-weight:700;letter-spacing:.12em;padding:2.5px 7px;border-radius:5px;margin-top:1px}
.issue.crit{border-color:rgba(255,77,109,.4)} .issue.crit .tag{background:rgba(255,77,109,.15);color:var(--red)}
.issue.warn .tag{background:rgba(255,180,84,.14);color:var(--amber)}
.issue.info .tag{background:rgba(56,225,255,.12);color:var(--cyan)}
.allclear{text-align:center;padding:14px;color:var(--green);font-family:var(--num);letter-spacing:.2em;font-size:.8rem;font-weight:600}

/* ===== SEGMENT / DO / DONT ===== */
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:4px}
.seg button{font-family:var(--num);font-weight:700;letter-spacing:.15em;font-size:.8rem;padding:9px 0;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--mut);cursor:pointer;transition:.2s}
.seg button.on.atk{background:rgba(47,230,167,.13);border-color:var(--green);color:var(--green);box-shadow:0 0 14px rgba(47,230,167,.25)}
.seg button.on.dfn{background:rgba(56,225,255,.12);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 14px rgba(56,225,255,.25)}
.seg button.on.wat{background:rgba(142,163,191,.12);border-color:var(--mut);color:var(--txt)}
.prog{height:4px;background:var(--panel2);border-radius:3px;margin:8px 0 10px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:3px;transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 8px rgba(47,230,167,.5)}
.doitem{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(56,189,248,.07);font-size:.84rem;line-height:1.5}
.doitem:last-child{border-bottom:none}
.chk{flex-shrink:0;width:21px;height:21px;border-radius:6px;border:1.5px solid var(--dim);background:transparent;cursor:pointer;position:relative;margin-top:1px;transition:.2s}
.chk.on{border-color:var(--green);background:rgba(47,230,167,.15);box-shadow:0 0 10px rgba(47,230,167,.35)}
.chk.on::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--green);font-size:.8rem;font-weight:700}
.doitem .tx{flex:1} .doitem.done .tx{color:var(--dim);text-decoration:line-through}
.del{flex-shrink:0;background:none;border:none;color:var(--dim);font-size:1rem;cursor:pointer;padding:0 4px}
.dontitem{display:flex;gap:9px;padding:8px 4px;font-size:.82rem;color:var(--mut);border-bottom:1px solid rgba(255,77,109,.08);align-items:flex-start;line-height:1.5}
.dontitem:last-child{border-bottom:none}
.dontitem::before{content:'⛔';font-size:.75rem;margin-top:1px}
.addrow{display:flex;gap:7px;margin-top:10px}
.addrow input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:9px 11px;font-size:.84rem;font-family:var(--jp)}
.addrow input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px rgba(56,225,255,.15)}
.btn{background:rgba(56,225,255,.12);border:1px solid var(--cyan);color:var(--cyan);border-radius:9px;padding:9px 15px;font-size:.8rem;font-weight:600;cursor:pointer;font-family:var(--jp);white-space:nowrap;transition:.15s}
.btn:active{transform:scale(.95)}
.btn.grn{background:rgba(47,230,167,.12);border-color:var(--green);color:var(--green)}
.btn.red{background:rgba(255,77,109,.1);border-color:rgba(255,77,109,.5);color:var(--red)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--mut)}
.btn.wide{width:100%;padding:11px;font-size:.86rem}

/* ===== POSITIONS ===== */
.sumstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pos{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;position:relative;overflow:hidden}
.pos.up{border-left:3px solid var(--green)} .pos.dn{border-left:3px solid var(--red)}
.pos-top{display:flex;align-items:baseline;gap:8px}
.pos-tk{font-family:var(--num);font-size:1.3rem;font-weight:700;letter-spacing:.05em}
.pos-nm{font-size:.72rem;color:var(--mut)}
.badge{font-family:var(--num);font-size:.56rem;font-weight:700;letter-spacing:.14em;padding:2.5px 7px;border-radius:5px}
.badge.core{background:rgba(56,225,255,.13);color:var(--cyan);border:1px solid rgba(56,225,255,.3)}
.badge.trade{background:rgba(255,180,84,.12);color:var(--amber);border:1px solid rgba(255,180,84,.3)}
.pos-price{margin-left:auto;text-align:right}
.pos-price b{font-family:var(--num);font-size:1.16rem;font-weight:700}
.pos-price small{display:block;font-family:var(--num);font-size:.72rem;font-weight:600}
.pos-mid{display:flex;gap:14px;margin:7px 0 9px;font-family:var(--num);font-size:.76rem;color:var(--mut);flex-wrap:wrap}
.pos-mid b{color:var(--txt);font-weight:600}
.pos-pnl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pos-pnl .big{font-family:var(--num);font-size:1.22rem;font-weight:700}
.pos-pnl .pct{font-family:var(--num);font-size:.86rem;font-weight:700}
.pos-pnl .jpy{font-family:var(--num);font-size:.76rem;color:var(--mut);margin-left:auto}
.up .big,.up .pct{color:var(--green)} .dn .big,.dn .pct{color:var(--red)}
.chips{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.chip{font-size:.68rem;padding:4px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);color:var(--mut);font-family:var(--num);font-weight:600;letter-spacing:.03em}
.chip.stopset{border-color:rgba(255,77,109,.35);color:#ff8fa5}
.chip.takeset{border-color:rgba(47,230,167,.3);color:var(--green)}
.chip.nostop{background:rgba(255,77,109,.13);border-color:var(--red);color:var(--red);animation:blink 1.4s infinite}
.pos-memo{font-size:.74rem;color:var(--mut);margin-top:8px;line-height:1.5;border-top:1px dashed rgba(56,189,248,.12);padding-top:7px}
.pos-edit{position:absolute;top:11px;right:11px;opacity:0}
.pos .editbtn{background:none;border:1px solid var(--line);border-radius:7px;color:var(--dim);font-size:.66rem;padding:4px 9px;cursor:pointer;font-family:var(--num);letter-spacing:.1em}
.xray-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:12px}
.xray-stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 7px;min-width:0;text-align:center}
.xray-stat small{display:block;font-family:var(--num);font-size:.52rem;font-weight:700;letter-spacing:.12em;color:var(--dim);margin-bottom:3px}
.xray-stat b{display:block;font-family:var(--num);font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xray-stat i{display:block;font-style:normal;font-family:var(--num);font-size:.56rem;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xray-list{display:grid;gap:9px}
.xray-row{min-width:0}
.xray-top,.xray-meta{display:flex;align-items:center;gap:8px;min-width:0}
.xray-top{font-family:var(--num);font-size:.7rem;margin-bottom:4px}
.xray-top b{font-size:.88rem;letter-spacing:.05em}
.xray-top .weight{margin-left:auto;color:var(--txt);font-weight:700}
.xray-top .xval{color:var(--mut);min-width:68px;text-align:right}
.xray-bar{height:6px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.xray-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 8px rgba(56,225,255,.38);transition:width .35s ease}
.xray-meta{justify-content:space-between;margin-top:4px;font-size:.62rem;color:var(--mut);line-height:1.4}
.qtag{font-family:var(--num);font-weight:700;letter-spacing:.06em;white-space:nowrap}
.qtag.good{color:var(--green)}.qtag.warn{color:var(--amber)}.qtag.bad{color:var(--red)}
.xray-action{display:flex;gap:9px;align-items:flex-start;margin-top:12px;padding:9px 10px;border-left:2px solid var(--cyan);background:rgba(56,225,255,.055);font-size:.73rem;line-height:1.55;color:var(--mut)}
.xray-action b{flex-shrink:0;font-family:var(--num);font-size:.58rem;letter-spacing:.14em;color:var(--cyan);padding-top:2px}
.xray-actions{display:flex;align-items:center;gap:9px;margin-top:10px;flex-wrap:wrap}
.xray-actions .btn:first-of-type{margin-left:auto}
.xray-note{font-size:.61rem;color:var(--dim);line-height:1.45}
.risk-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:10px 0}
.risk-metric{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 7px;min-width:0;text-align:center}
.risk-metric small{display:block;font-family:var(--num);font-size:.5rem;font-weight:700;letter-spacing:.1em;color:var(--dim);margin-bottom:3px}
.risk-metric b{display:block;font-family:var(--num);font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.risk-metric i{display:block;font-style:normal;font-family:var(--num);font-size:.55rem;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.risk-quality{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;background:rgba(56,225,255,.055);border-left:2px solid var(--cyan);font-size:.7rem;line-height:1.55;color:var(--mut)}
.risk-quality b{flex-shrink:0;font-family:var(--num);font-size:.56rem;letter-spacing:.12em;color:var(--cyan);padding-top:2px}
.trade-gate-output{margin-top:12px;padding:11px;background:var(--panel2);border:1px solid var(--line);border-radius:11px}
.trade-gate-verdict{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:9px}
.trade-gate-verdict b{font-family:var(--num);font-size:1.25rem;letter-spacing:.08em}
.trade-gate-verdict span{font-size:.66rem;color:var(--mut);text-align:right}
.trade-gate-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.trade-gate-cell{min-width:0;text-align:center;padding:7px 5px;border-top:1px solid var(--line)}
.trade-gate-cell small{display:block;font-size:.52rem;color:var(--dim);letter-spacing:.08em}
.trade-gate-cell b{display:block;font-family:var(--num);font-size:.82rem;margin-top:2px;overflow-wrap:anywhere}
.recovery-list{display:grid;gap:8px;margin-top:10px}
.recovery-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.recovery-row b{display:block;font-size:.76rem}.recovery-row small{display:block;color:var(--dim);font-size:.62rem;margin-top:2px}

  const fx=S.settings.usdJpy||150;
  const ps=S.positions||[];
  const usdPs=ps.filter(p=>String(p?.currency||'USD').toUpperCase()==='USD'),unsupportedCurrency=ps.filter(p=>String(p?.currency||'USD').toUpperCase()!=='USD');
  let cost=0,val=0,frameUsed=0,dayPnl=0;
  usdPs.forEach(p=>{
    const hasPrice=p.price!=null&&p.price!==''&&Number.isFinite(Number(p.price));
    const live=hasPrice?Number(p.price):Number(p.avgCost)||0;
    const c=p.shares*p.avgCost,v=p.shares*live;cost+=c;val+=v;if(p.role!=='core')frameUsed+=c*fx;
    const ch=Number(p.changePct)||0;if(live&&ch>-99.9){const prev=live/(1+ch/100);dayPnl+=(live-prev)*p.shares}
  });
  const pnl=val-cost;
  const cashUsd=(Number(S.cash?.usd)||0)+(Number(S.cash?.jpy)||0)/fx;
  const netVal=val+cashUsd;
  const priceH=ps.length?Math.max(...ps.map(p=>hAgo(p.syncedAt||p.priceAt))):Infinity;
  const fxH=hAgo(S.settings.fxRetrievedAt||S.settings.fxAt);
  const issues=[];
  const guardComplete=Number.isFinite(fx)&&fx>0&&!unsupportedCurrency.length&&ps.filter(p=>Number(p.shares)>0).every(p=>Number.isFinite(Number(p.price))&&Number(p.price)>0);
  const fxGuardValid=['live','previous-close-valid','reference'].includes(String(S.settings.fxFreshness||''))&&String(S.settings.fxSource||'manual').toLowerCase()!=='manual';
  const guardFresh=guardComplete&&fxGuardValid&&!S.settings.fxStale&&fxH<=24&&ps.filter(p=>Number(p.shares)>0).every(p=>['live','previous-close-valid'].includes(String(p.freshness||''))&&String(p.priceSource||'manual').toLowerCase()!=='manual'&&!p.stale&&hAgo(p.syncedAt||p.priceAt)<=24);
  const drawdown=drawdownGuardMetrics(netVal*fx);drawdown.dataComplete=guardComplete;drawdown.dataFresh=guardFresh;
  if(drawdown.breached&&guardFresh)issues.push({sev:'warn',msg:`🛡 DRAWDOWN候補: 円換算残高が履歴ピークから${drawdown.drawdown.toFixed(1)}%（設定${drawdown.threshold}%）。入出金未調整のため自動停止せず、入出金→価格→サイズを照合`});
  else if(drawdown.breached)issues.push({sev:'warn',msg:`DRAWDOWN GUARD候補 ${drawdown.drawdown.toFixed(1)}%: データが未取得または古いため、同期後に再判定`});
  else if(drawdown.near)issues.push({sev:'warn',msg:`DRAWDOWN GUARD接近: 履歴ピーク比${drawdown.drawdown.toFixed(1)}%（警戒${drawdown.threshold}%）`});
  if(!drawdown.armed&&drawdown.legacyPoints)issues.push({sev:'info',msg:'DRAWDOWN GUARD: 新鮮な円換算純資産履歴を2日分学習すると監視を開始'});
  if(ps.length&&priceH>72)issues.push({sev:'crit',msg:`株価データが${agoTxt(priceH)}のまま停止中。BOT同期かJSON取込で更新を`});
  else if(ps.length&&priceH>24)issues.push({sev:'warn',msg:`株価データが${agoTxt(priceH)}。鮮度低下`});
  else if(ps.some(p=>p.stale))issues.push({sev:'warn',msg:'一部の株価は上流障害前の正常キャッシュです'});
  if(fxH>72)issues.push({sev:'warn',msg:`為替レートが${agoTxt(fxH)}のまま（${fx}円）`});
  else if(S.settings.fxStale)issues.push({sev:'warn',msg:'為替は上流障害前の正常キャッシュです'});
  if(S.sync?.status==='error')issues.push({sev:'warn',msg:`データ同期エラー: ${S.sync.lastError||'接続先を確認'}`});
  if(unsupportedCurrency.length)issues.push({sev:'crit',msg:`非USD銘柄 ${unsupportedCurrency.map(p=>p.ticker+'('+String(p.currency||'不明')+')').slice(0,4).join('・')} は換算レート未対応。NAV・リスク計算から除外し、新規判断を停止`});
  if(saveFailed)issues.push({sev:'warn',msg:'端末への自動保存に失敗。JSON書出でバックアップしてください'});
  ps.forEach(p=>{
    if(!p.stop&&!p.stopPx&&p.role!=='core')issues.push({sev:'crit',msg:`${p.ticker}: 損切りライン未設定（トレード枠）`});
    if(!p.stop&&!p.stopPx&&p.role==='core')issues.push({sev:'info',msg:`${p.ticker}: コア銘柄・stop任意（未設定）`});
    if(p.stopPx&&p.price&&p.price<=p.stopPx)issues.push({sev:'crit',msg:`⛔ STOP HIT: ${p.ticker} $${p.price} ≤ 設定$${p.stopPx} — 撤退執行を確認`});
    else if(p.takePx&&p.price&&p.price>=p.takePx)issues.push({sev:'warn',msg:`🎯 利確帯到達: ${p.ticker} $${p.price} ≥ 設定$${p.takePx}`});
    const _r=(typeof rsi14==='function')?rsi14((S.spark||{})[p.ticker]):null;
    if(_r!=null&&_r>=75)issues.push({sev:'info',msg:`${p.ticker}: RSI${_r} 過熱圏（追撃注意）`});
    else if(_r!=null&&_r<=25)issues.push({sev:'info',msg:`${p.ticker}: RSI${_r} 売られすぎ圏`});
  });
  const net={};(S.journal||[]).forEach(j=>{net[j.ticker]=(net[j.ticker]||0)+(j.side==='BUY'?j.shares:-j.shares)});
  Object.entries(net).forEach(([t,n])=>{if(n>0&&!ps.find(p=>p.ticker===t))issues.push({sev:'warn',msg:`${t}: 日誌上${n}株買い越しだがポジション未登録（不整合）`})});
  const dup={};(S.plan.dos||[]).forEach(d=>{const tk=(d.text.match(/^[A-Z]{1,5}/)||[''])[0];if(!tk)return;const nums=(d.text.match(/\d+(?:\.\d+)?/g)||[]).join(',');const k=tk+'|'+nums;(dup[k]=dup[k]||[]).push(d)});
  Object.values(dup).forEach(a=>{if(a.length>1)issues.push({sev:'warn',msg:`DOリスト重複の疑い: 「${a[0].text.slice(0,20)}…」×${a.length}件`})});
  if(S.cash&&S.cash.usd==null)issues.push({sev:'info',msg:'USD現金残高が未入力'});
  const tstr=todayStr();
  if(S.plan.date&&S.plan.date!==tstr)issues.push({sev:'warn',msg:`作戦日付が${S.plan.date}（本日ではない）`});
  const day0=new Date();day0.setHours(0,0,0,0);
  (S.events||[]).forEach(ev=>{const d=new Date(ev.date+'T00:00:00');const dl=Math.round((d-day0)/864e5);
    if(dl>=0&&dl<=3&&((S.positions||[]).find(p=>p.ticker===ev.ticker)||(S.watch||[]).includes(ev.ticker)))issues.push({sev:'warn',msg:`📅 ${ev.ticker} ${ev.label||'イベント'}まで${dl===0?'本日':dl+'日'} — 直前エントリー禁止ルール確認`});
  });
  const aiMarketCurrent=S.ai?.market&&!marketRegimeAnalysisIsOld(S.ai.market)?S.ai.market:null;
  if(S.ai?.market&&!aiMarketCurrent)issues.push({sev:'warn',msg:'AI市場分析はVIX・WTI・SPYの旧revisionまたは取得不能時の結果です。現在判断には使わず再分析してください'});
  const crits=issues.filter(i=>i.sev==='crit').length, warns=issues.filter(i=>i.sev==='warn').length;
  const health=Math.max(0,Math.min(100,100-crits*25-warns*10));
  const concl=aiMarketCurrent?.concl;
  let verdict,vcolor,vreason;
  if(crits>0){verdict='停止';vcolor='var(--red)';vreason=issues.find(i=>i.sev==='crit').msg}
  else if(concl==='defend'){verdict='守り';vcolor='var(--cyan)';vreason=aiMarketCurrent.reason||'AI結論: 守り'}
  else if(concl==='attack'){verdict='攻め';vcolor='var(--green)';vreason=aiMarketCurrent.reason||'AI結論: 攻め'}
  else{verdict='様子見';vcolor='var(--mut)';vreason='AI結論なし。JSON取込かBOT同期で更新'}
  if(S.plan.conclusion){const m={attack:['攻め','var(--green)'],defend:['守り','var(--cyan)'],wait:['様子見','var(--mut)']};if(crits===0&&m[S.plan.conclusion]){verdict=m[S.plan.conclusion][0];vcolor=m[S.plan.conclusion][1];vreason='本日の結論（手動設定）'+(aiMarketCurrent?.reason?'｜AI: '+aiMarketCurrent.reason:'')}}
  return{fx,cost,val,netVal,cashUsd,pnl,dayPnl,frameUsed,priceH,fxH,drawdown,issues,crits,warns,health,verdict,vcolor,vreason,unsupportedCurrencyCount:unsupportedCurrency.length};
}

function roll(el,to,f){if(!el)return;const t0=performance.now(),dur=900;function step(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=f(to*e);if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}
function eqChart(){

  });
  return `<svg viewBox="0 0 ${W} ${Ht}" style="width:100%;height:auto;display:block">
    <polyline points="${pts} ${px(vals.length-1).toFixed(1)},${Ht-pad} ${px(0).toFixed(1)},${Ht-pad}" fill="${up?'rgba(47,230,167,.09)':'rgba(255,77,109,.09)'}" stroke="none"/>

function portfolioXraySnapshot(state){
  const positions=Array.isArray(state?.positions)?state.positions:[];
  const num=v=>Number.isFinite(Number(v))?Number(v):null;
  const fx=num(state?.settings?.usdJpy),fxValid=fx!=null&&fx>0;
  const jpyCash=num(state?.cash?.jpy)||0,usdCash=num(state?.cash?.usd)||0;
  const rows=positions.map((p,index)=>{
    const shares=num(p?.shares),price=num(p?.price),avgCost=num(p?.avgCost),stop=num(p?.stopPx);
    const currency=String(p?.currency||'USD').toUpperCase(),supportedCurrency=currency==='USD';
    const active=shares!=null&&shares>0,validPrice=active&&price!=null&&price>0,validMark=validPrice&&supportedCurrency;
    const marketValueUsd=validMark?shares*price:null;
    const hasNumericStop=validMark&&stop!=null&&stop>0;

function xrayQuoteQuality(p,row){

  if(p.providerComparison?.status==='divergent')return{key:'divergent',label:`provider差 ${Number(p.providerComparison.differencePct||0).toFixed(1)}%`,cls:'bad',score:20,hours};

function stressScenarioSnapshot(stockShockPct,fxShockPct,state){
  const stockShock=Number(stockShockPct),fxShock=Number(fxShockPct);
  if(!Number.isFinite(stockShock)||stockShock<-100||!Number.isFinite(fxShock)||fxShock<=-100)return{complete:false,reason:'ショック値が計算範囲外です'};
  const fx=Number(state?.settings?.usdJpy),positions=Array.isArray(state?.positions)?state.positions:[];
  if(!Number.isFinite(fx)||fx<=0)return{complete:false,reason:'USD/JPYが未取得または無効です'};
  const active=positions.filter(p=>Number.isFinite(Number(p?.shares))&&Number(p.shares)>0);
  const unsupported=active.filter(p=>String(p?.currency||'USD').toUpperCase()!=='USD');
  if(unsupported.length)return{complete:false,reason:`非USD ${unsupported.length}銘柄は換算レート未対応です。USDとして誤換算せず算定を停止しました`,unsupportedCurrencyCount:unsupported.length};
  const missing=active.filter(p=>!Number.isFinite(Number(p?.price))||Number(p.price)<=0);
  if(missing.length)return{complete:false,reason:`価格未取得 ${missing.length}銘柄。未評価をゼロ扱いせず算定を停止しました`,missingPriceCount:missing.length};
  const s=stockShock/100,f=fxShock/100,stressedFx=fx*(1+f);
  const jpyCash=Number.isFinite(Number(state?.cash?.jpy))?Number(state.cash.jpy):0;
  const usdCash=Number.isFinite(Number(state?.cash?.usd))?Number(state.cash.usd):0;
  const ageHours=iso=>{const t=Date.parse(String(iso||''));return Number.isFinite(t)?Math.max(0,(Date.now()-t)/36e5):Infinity};
  const exposures=active.map(p=>({ticker:String(p.ticker||''),marketValueUsd:Number(p.shares)*Number(p.price),stale:!!p.stale||ageHours(p.syncedAt||p.priceAt)>24,manual:String(p.priceSource||'manual').toLowerCase()==='manual'}));
  const stockMarketValueUsd=exposures.reduce((sum,p)=>sum+p.marketValueUsd,0);
  const baseJpy=jpyCash+fx*(usdCash+stockMarketValueUsd);
  const stressedJpy=jpyCash+stressedFx*(usdCash+stockMarketValueUsd*(1+s));
  const deltaJpy=stressedJpy-baseJpy,deltaPct=baseJpy>0?deltaJpy/baseJpy*100:null;
  const stockContributionJpy=stockMarketValueUsd*fx*s;
  const fxContributionJpy=(stockMarketValueUsd+usdCash)*fx*f;
  const interactionJpy=stockMarketValueUsd*fx*s*f;
  const contributors=exposures.map(p=>({name:p.ticker,deltaJpy:p.marketValueUsd*fx*((1+s)*(1+f)-1)}));
  if(usdCash)contributors.push({name:'USD現金',deltaJpy:usdCash*fx*f});
  contributors.sort((a,b)=>a.deltaJpy-b.deltaJpy||a.name.localeCompare(b.name));
  const fxOld=ageHours(state?.settings?.fxRetrievedAt||state?.settings?.fxAt)>24,fxManual=String(state?.settings?.fxSource||'manual').toLowerCase()==='manual';
  return{complete:true,stockShock,fxShock,fx,stressedFx,jpyCash,usdCash,stockMarketValueUsd,baseJpy,stressedJpy,deltaJpy,deltaPct,stockContributionJpy,fxContributionJpy,interactionJpy,worstContributor:contributors[0]||null,stale:!!state?.settings?.fxStale||fxOld||exposures.some(p=>p.stale),manual:fxManual||exposures.some(p=>p.manual)};
}

function saveJr(id){
  const g=i=>$(i).value.trim();
  const pnlText=g('#j-pnl');const o={ticker:normalizeTicker(g('#j-tk')),side:$('#j-side').value,shares:Number(g('#j-sh')),price:Number(g('#j-pr')),dt:g('#j-dt'),tag:g('#j-tag'),memo:g('#j-memo'),lesson:g('#j-lesson'),pnl:pnlText===''?null:Number(pnlText),result:''};
  if(!TICKER_RE.test(o.ticker)){toast('ティッカー形式を確認してください');return}
  if(!Number.isFinite(o.shares)||o.shares<=0||!Number.isFinite(o.price)||o.price<=0){toast('株数と価格は0より大きい数値で入力してください');return}
  if(o.pnl!=null&&!Number.isFinite(o.pnl)){toast('実現損益は数値で入力してください');return}
  if(o.pnl==null&&o.side==='SELL'){const p=S.positions.find(x=>x.ticker===o.ticker);if(p)o.pnl=+((o.price-p.avgCost)*o.shares).toFixed(2)}

  if(!tk||!ps||!id){toast('トークン・合言葉・Gist IDを設定');return}
  if(!confirm('クラウドの内容で現在のデータを上書きします。よろしいですか？'))return;
  toast('☁ 取得中…');
  try{
    const r=await fetch('https://api.github.com/gists/'+id,{headers:ghH(tk)});
    if(!r.ok)throw 0;
    const j=await r.json();
    const f=j.files&&j.files['us-command.enc.json'];
    let content=f&&f.content;
    if(f&&f.truncated&&f.raw_url){const r2=await fetch(f.raw_url);content=await r2.text()}
    const st=await decState(ps,content);
    const keep={ghToken:tk,cloudPass:ps,gistId:id,apiBase:S.settings.apiBase,apiToken:S.settings.apiToken};
    if(mergeState(st)){Object.assign(S.settings,keep);save();toast('☁ 復元完了');beep(990,.12);shisa('happy','同期完了。オカエリナサイ、相棒！',5000)}
  }catch(e){toast('復元失敗: 合言葉かGist IDを確認')}
}

function rrc(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawMonCv(g,line,stage,x,y,sc){
 const arr=MON_SPR[line]||MON_SPR.shisa;const grid=arr[stage]||arr[0];
 const pal=Object.assign({},MON_COMMON,MON_PAL[line]||{});
 for(let yy=0;yy<16;yy++)for(let xx=0;xx<16;xx++){const ch=grid[yy][xx];if(ch==='.')continue;g.fillStyle=pal[ch];g.fillRect(x+xx*sc,y+yy*sc,sc,sc)}
}

let AIS=null,aiBusy=false;
async function checkAiSrc(){
  if(AIS!==null)return AIS;
  try{
    const r=await fetch((S.settings.apiBase||'').replace(/\/$/,'')+'/api/ai-status',{headers:S.settings.apiToken?{'Authorization':'Bearer '+S.settings.apiToken}:{},cache:'no-store'});

  }catch(e){}

}
async function updateAiSrcLabel(){
  const el=$('#aisrc');if(!el)return;
  const st=await checkAiSrc();
  const el2=$('#aisrc');if(!el2)return;
  el2.textContent=st.mode==='server'?`AI直結 ON（${st.model}）`:'直結を試行 / 手動OK';
}
async function aiAutoRun(mode){
  if(aiBusy){toast('演算中デス。少々お待ちクダサイ');return}
  const prompt=mode==='review'?buildReviewPrompt():buildPrompt();
  aiBusy=true;
  const b1=$('#aiAutoBtn'),b2=$('#aiRevBtn');if(b1)b1.disabled=true;if(b2)b2.disabled=true;
  const st=$('#aisrc');if(st)st.textContent='分析中…（30〜90秒）';
  shisa('normal',mode==='review'?'直近2週間を解析シマス…少々お待ちクダサイ':'AIコアに照会中…30〜90秒ほどお待ちクダサイ',90000);
  let text=null,err='';
  const base=(S.settings.apiBase||'').replace(/\/$/,'');
  try{
    const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),115000);
    const r=await fetch(base+'/api/ai-analyze',{method:'POST',signal:ctl.signal,
      headers:Object.assign({'Content-Type':'application/json'},S.settings.apiToken?{'Authorization':'Bearer '+S.settings.apiToken}:{}),
      body:JSON.stringify({prompt})});
    clearTimeout(to);
    if(r.ok){const j=await r.json();text=j.text||null}
    else if(r.status===503)err='no_key';
    else err='server_'+r.status;
  }catch(e){err='unreachable'}
  aiBusy=false;if(b1)b1.disabled=false;if(b2)b2.disabled=false;
  if(!text){
    if(st)st.textContent='自動NG → 手動で';
    shisa('normal','自動回線が不通デス。①プロンプト生成→AIに貼付→③で反映してクダサイ',9000);
    toast(err==='no_key'?'RenderにANTHROPIC_API_KEY未設定（README参照）':'自動分析に届かず。手動パイプラインをどうぞ');
    return;
  }
  if(st)st.textContent='反映中…';
  const ok=mode==='review'?applyReviewText(text):applyAiText(text);
  if(st)st.textContent=ok?'完了':'解析失敗（貼付欄で再試行可）';
  if(!ok&&$('#aibox'))$('#aibox').value=text;
}

async function fetchQuoteBatch(base,symbols){
  const endpoint=(base||'')+'/api/quotes';
  const url=new URL(endpoint,location.origin);url.searchParams.set('symbols',symbols.join(','));url.searchParams.set('_',Date.now());
  const headers=S.settings.apiToken?{'Authorization':'Bearer '+S.settings.apiToken}:{};
  let lastError;
  for(let attempt=0;attempt<2;attempt++){
    const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),75000);
    try{
      const res=await fetch(url,{headers,signal:ctl.signal,cache:'no-store'});
      const type=res.headers.get('content-type')||'';
      if(!type.includes('application/json')){const e=new Error('APIがJSON以外を返しました（Render起動中の可能性）');e.status=res.status;e.retryable=true;throw e}
      const body=await res.json();
      if(!res.ok){const e=new Error(body.message||`HTTP ${res.status}`);e.status=res.status;e.retryable=[502,503,504].includes(res.status);throw e}
      if(!body||typeof body.quotes!=='object')throw new Error('市場データ応答の形式が不正です');
      return body;
    }catch(e){lastError=e;if(e?.name==='AbortError'||!e.retryable||attempt===1)throw e;await wait(1800)}
    finally{clearTimeout(timer)}
  }
  throw lastError||new Error('同期に失敗しました');
}
